<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EuroStere</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#faf6f0;--card:#fff;--tx:#2a1d12;--mut:#7a6a5a;--pri:#b4541a;--pri2:#8f4013;--bd:#e6dccd;--ok:#2f7d4a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1410;--card:#262019;--tx:#f3ebe0;--mut:#b3a590;--pri:#e0803f;--pri2:#c96a2c;--bd:#3a3128;--ok:#5fc283}}
:root[data-theme="dark"]{--bg:#1a1410;--card:#262019;--tx:#f3ebe0;--mut:#b3a590;--pri:#e0803f;--pri2:#c96a2c;--bd:#3a3128;--ok:#5fc283}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:12px 16px;z-index:5}
.logo{font-weight:800;font-size:19px;color:var(--pri)}
.cartbtn{background:var(--pri);color:#fff;border:0;border-radius:20px;padding:8px 14px;font-weight:700;font-size:14px}
.hero{padding:28px 16px;text-align:center;background:linear-gradient(135deg,#8f4013,#d9873f);color:#fff}
.hero h1{margin:0 0 8px;font-size:26px}.hero p{margin:0 auto;max-width:520px;opacity:.95}
.badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;font-size:13px}
.badges span{background:rgba(255,255,255,.2);padding:5px 10px;border-radius:14px}
main{max-width:980px;margin:0 auto;padding:16px}
h2{font-size:20px;margin:18px 0 10px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select,input,select{font:inherit;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);width:100%}
.filters select{width:auto;flex:1;min-width:140px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.cb{padding:12px}.cb h3{margin:0 0 4px;font-size:17px}.mut{color:var(--mut);font-size:13px}
.price{font-size:22px;font-weight:800;color:var(--pri);margin:8px 0}.price small{font-size:13px;font-weight:400;color:var(--mut)}
.row{display:flex;gap:8px;align-items:center}
.row input{width:80px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:11px 14px;font-weight:700;font-size:15px;width:100%;cursor:pointer}
.btn:hover{background:var(--pri2)}.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.panel label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.line{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--bd);font-size:14px}
.tot{font-weight:800;font-size:18px;border:0}
.steps{display:flex;gap:6px;margin-bottom:12px;font-size:12px}
.steps div{flex:1;text-align:center;padding:6px;border-radius:8px;background:var(--bd);color:var(--mut)}
.steps .on{background:var(--pri);color:#fff;font-weight:700}
.pay{display:flex;gap:8px;flex-wrap:wrap}.pay label{flex:1;min-width:110px;border:1px solid var(--bd);border-radius:8px;padding:10px;text-align:center;margin:0;color:var(--tx);cursor:pointer}
.pay input{display:none}.pay input:checked+span{color:var(--pri);font-weight:800}
.hide{display:none}.ok{color:var(--ok);font-weight:800;font-size:22px}
.rm{background:none;border:0;color:#c33;font-size:18px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.gal img{width:100%;height:130px;object-fit:cover;border-radius:10px;display:block}
footer{text-align:center;color:var(--mut);font-size:12px;padding:24px 16px}
.lgs{width:auto;padding:6px;margin:0 8px 0 auto}.hd{display:flex;align-items:center}
details{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px}summary{font-weight:700;cursor:pointer}details p{margin:8px 0 0;color:var(--mut)}
#wa{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:#25d366;color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;text-decoration:none;z-index:9;box-shadow:0 2px 8px rgba(0,0,0,.3)}
footer a{color:var(--pri)}
</style>
</head>

</main></section>

function nm(x){return E[L][EK.indexOf(x.e)]+" – "+t("ste")+(x.pal?" ("+t("pal")+")":"")}

function qty(){var n=0;for(var k in cart)n+=cart[k];return n}
function sub(){var s=0;for(var k in cart)s+=pr(k).p*cart[k];return s}
function rate(){var n=qty();return n>=20?.12:n>=10?.08:n>=5?.05:0}
function dsc(){return sub()*rate()}
function ship(){var c=$("co").value;return qty()?C[c][1]+Math.max(0,qty()-1)*8:0}
function upd(){$("cnt").textContent=qty()}
function sl(v){L=v;try{localStorage.setItem("lang",L)}catch(e){}ap()}
function fo(){var a=$("fe").value,l=$("fl").value,h='<option value="">'+t("ae")+'</option>';
EK.forEach(function(k,i){h+='<option value="'+k+'">'+E[L][i]+'</option>'});$("fe").innerHTML=h;$("fe").value=a;
$("fl").innerHTML='<option value="">'+t("al")+'</option><option>25 cm</option><option>33 cm</option><option>50 cm</option>';$("fl").value=l}
function fc(){var s=$("co"),v=s.value||"FR",h="";for(var k in C)h+='<option value="'+k+'">'+cn(k)+'</option>';s.innerHTML=h;s.value=v}
function renderP(){var e=$("fe").value,l=$("fl").value,h="";
P.filter(function(x){return(!e||x.e==e)&&(!l||x.l==l)}).forEach(function(x){
h+='<div class="card"><img src="images/'+x.img+'" alt="'+nm(x)+'" loading="lazy" style="width:100%;height:170px;object-fit:cover;display:block"><div class="cb"><h3>'+nm(x)+'</h3><div class="mut">'+t("lg")+' '+x.l+'</div><div class="price">'+eur(x.p)+' <small>'+t("ps")+'</small></div><div class="row"><input type="number" min="1" value="1" id="q'+x.id+'"><button class="btn" onclick="add('+x.id+')">'+t("add")+'</button></div></div></div>'});
$("prods").innerHTML=h}
function add(id){var q=parseInt($("q"+id).value)||1;cart[id]=(cart[id]||0)+q;upd();$("q"+id).value=1;show("cart")}
function tl(sh){var s=sub(),d=dsc(),h='<div class="line"><span>'+t("gd")+' ('+qty()+')</span><span>'+eur(s)+'</span></div>';
if(d)h+='<div class="line"><span>'+t("dis")+' (−'+Math.round(rate()*100)+' %)</span><span>−'+eur(d)+'</span></div>';
if(sh)h+='<div class="line"><span>'+t("dl")+' '+cn($("co").value)+'</span><span>'+eur(ship())+'</span></div>';
return h+'<div class="line tot"><span>'+(sh?t("tot"):t("sub"))+'</span><span>'+eur(s-d+(sh?ship():0))+'</span></div>'}
function renderCart(){var h="",k;for(k in cart){var x=pr(k);
h+='<div class="line"><span>'+nm(x)+' × '+cart[k]+'</span><span>'+eur(x.p*cart[k])+' <button class="rm" onclick="del('+k+')">×</button></span></div>'}
$("cartlist").innerHTML=h?h+tl(0):'<p class="mut">'+t("emp")+'</p>'}
function del(k){delete cart[k];upd();renderCart()}
function show(s){$("shop").classList.toggle("hide",s!="shop");$("cart").classList.toggle("hide",s!="cart");if(s=="cart")go(1);window.scrollTo(0,0)}
function go(n){if(n>1&&!qty()){alert(t("emp"));return}
if(n==3){var r=["fn","ln","em","ph","ad","zp","ci"];for(var i=0;i<r.length;i++){if(!$(r[i]).value.trim()){alert(t("e2"));return}}
if($("em").value.indexOf("@")<1){alert(t("e2"));return}recap()}
for(var j=1;j<=4;j++)$("v"+j).classList.toggle("hide",j!=n);
for(var j=1;j<=3;j++)$("s"+j).classList.toggle("on",j<=Math.min(n,3));
if(n==1)renderCart();window.scrollTo(0,0)}
function recap(){$("recap").innerHTML=tl(1)+'<p class="mut">'+esc($("ad").value)+', '+esc($("zp").value)+' '+esc($("ci").value)+', '+cn($("co").value)+'</p>'}
function pm(){var v=document.querySelector("input[name=pm]:checked").value;$("pother").textContent=t(v=="card"?"m1":v=="vir"?"m2":"m3")}
function pay(){var no="SP-"+Date.now().toString().slice(-7),c=$("co").value,t2=sub()-dsc()+ship(),k,l=[];
for(k in cart){var x=pr(k);l.push(cart[k]+" x "+E.fr[EK.indexOf(x.e)]+" "+x.l+(x.pal?" palette":"")+" = "+eur(x.p*cart[k]))}
if(dsc())l.push("Remise -"+Math.round(rate()*100)+"% = -"+eur(dsc()));
var f={"form-name":"orders",numero:no,client:$("fn").value+" "+$("ln").value,email:$("em").value,telephone:$("ph").value,adresse:$("ad").value+", "+$("zp").value+" "+$("ci").value,pays:C[c][0],instructions:"["+L.toUpperCase()+"] "+$("nt").value,articles:l.join(" | "),total:eur(t2),paiement:{card:"Carte",vir:"Virement",pp:"PayPal"}[document.querySelector("input[name=pm]:checked").value]};
var body=Object.keys(f).map(function(q){return encodeURIComponent(q)+"="+encodeURIComponent(f[q])}).join("&");
var b=document.querySelector("#v3 .btn:not(.sec)");b.disabled=true;b.textContent=t("sd");
fetch("/",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:body}).then(function(r){if(!r.ok)throw 0;
$("conf").innerHTML=t("ord")+" <b>"+no+"</b> · "+eur(t2)+"<br>"+t("ok2");cart={};upd();go(4);b.disabled=false;b.textContent=t("cf")}).catch(function(){b.disabled=false;b.textContent=t("cf");alert(t("e4"))})}
function ap(){document.documentElement.lang=L;[].forEach.call(document.querySelectorAll("[data-i]"),function(e){e.textContent=t(e.getAttribute("data-i"))});
$("lg").value=L;fo();fc();renderP();pm();
if(!$("v1").classList.contains("hide"))renderCart();if(!$("v3").classList.contains("hide"))recap()}
ap();
$("gal").innerHTML=G.map(function(g){return '<img src="images/'+g+'" alt="" loading="lazy">'}).join("");
if(R.length){$("rv").classList.remove("hide");$("rvl").innerHTML=R.map(function(r){return '<div class="panel"><b>'+esc(r.n)+'</b> <span class="mut">'+esc(r.p)+'</span><p>'+esc(r.t)+'</p></div>'}).join("")}
if(WA){$("wa").href="https://wa.me/"+WA.replace(/\D/g,"");$("wa").classList.remove("hide")}
</script>
</body>
</html>
