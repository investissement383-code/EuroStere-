<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>EuroStere – Admin</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf6f0;--card:#fff;--tx:#2a1d12;--mut:#7a6a5a;--pri:#b4541a;--bd:#e6dccd}
@media (prefers-color-scheme:dark){:root{--bg:#1a1410;--card:#262019;--tx:#f3ebe0;--mut:#b3a590;--pri:#e0803f;--bd:#3a3128}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px;max-width:760px;margin:auto}
input,button,select{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);width:100%;margin-bottom:8px}
button{background:var(--pri);color:#fff;border:0;font-weight:700}.o{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px;font-size:14px}
.o h3{margin:0 0 6px;font-size:16px}.m{color:var(--mut);font-size:12px}a{color:var(--pri)}.hide{display:none}
</style></head><body>
<h2>🪵 EuroStere – Commandes</h2>
<div id="lg"><input id="pw" type="password" placeholder="Mot de passe admin"><button onclick="load()">Se connecter</button></div>
<div id="ad" class="hide"><div class="m" id="st"></div><input id="q" placeholder="Rechercher (nom, pays, n° commande…)" oninput="draw()"><select id="sf" onchange="draw()"></select><button onclick="load()">Actualiser</button><div id="ls"></div></div>
<script>
var D=[],ST={topay:"À payer",paid:"Payée",shipped:"Expédiée",delivered:"Livrée",cancelled:"Annulée"};
function $(i){return document.getElementById(i)}
function esc(t){var d=document.createElement("div");d.textContent=t||"";return d.innerHTML}
function api(p,body){return fetch("/.netlify/functions/"+p,{method:"POST",headers:{"x-admin-password":$("pw").value,"content-type":"application/json"},body:JSON.stringify(body)})}
function load(){fetch("/.netlify/functions/orders",{headers:{"x-admin-password":$("pw").value}}).then(function(r){if(!r.ok)return r.text().then(function(t){throw t});return r.json()}).then(function(d){D=d;$("lg").classList.add("hide");$("ad").classList.remove("hide");
if(!$("sf").options.length)$("sf").innerHTML='<option value="">Tous les statuts</option>'+Object.keys(ST).map(function(k){return '<option value="'+k+'">'+ST[k]+'</option>'}).join("");draw()}).catch(function(e){alert(e||"Erreur")})}
function setS(el){var n=el.getAttribute("data-n"),v=el.value;api("status",{numero:n,status:v}).then(function(r){if(!r.ok)throw 0;D.forEach(function(o){if(o.numero==n)o.status=v});draw()}).catch(function(){alert("Statut non enregistré")})}
function inv(el){var n=el.getAttribute("data-n");el.disabled=true;
api("invoice",{numero:n}).then(function(r){if(!r.ok)return r.text().then(function(t){throw t});return r.blob()}).then(function(b){var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="facture-"+n+".pdf";document.body.appendChild(a);a.click();a.remove()}).catch(function(e){alert(e||"Erreur")}).then(function(){el.disabled=false})}
function draw(){var q=$("q").value.toLowerCase(),f=$("sf").value,h="",n=0;
D.forEach(function(o){if(f&&o.status!=f)return;if(q&&JSON.stringify(o).toLowerCase().indexOf(q)<0)return;n++;
h+='<div class="o"><h3>'+esc(o.numero)+' · '+esc(o.total)+'</h3><div class="m">'+new Date(o.date).toLocaleString("fr-FR")+' · '+esc(o.paiement)+'</div>'
+'<select data-n="'+esc(o.numero)+'" onchange="setS(this)">'+Object.keys(ST).map(function(k){return '<option value="'+k+'"'+(k==o.status?' selected':'')+'>'+ST[k]+'</option>'}).join("")+'</select>'
+'<p><b>'+esc(o.client)+'</b><br><a href="mailto:'+esc(o.email)+'">'+esc(o.email)+'</a> · <a href="tel:'+esc(o.telephone)+'">'+esc(o.telephone)+'</a></p><p>📍 '+esc(o.adresse)+', '+esc(o.pays)+'</p><p>'+esc(o.articles).split(" | ").join("<br>")+'</p>'
+(o.instructions?'<p class="m">Note : '+esc(o.instructions)+'</p>':'')+'<button data-n="'+esc(o.numero)+'" onclick="inv(this)">Facture PDF</button></div>'});
$("st").textContent=n+" commande(s)";$("ls").innerHTML=h||"<p class='m'>Aucune commande.</p>"}
</script></body></html>
